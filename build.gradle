/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java'
    id 'maven-publish'
    id 'eclipse'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

repositories {
    maven {
        url = uri('https://repo.maven.apache.org/maven2')
    }
    // paymenthub-ee-bom and paymenthub-ee-core 2.0.0-SNAPSHOT live on the
    // official Mifos JFrog. The old fyn-libs-snapshot repo is gone: it only
    // served ph-ee-connector-common 1.x.
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local')
    }
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/mifosx-gradle-local')
    }
}

dependencies {
    // Mifos Platform BOM pins Spring Boot 3.4, Camel 4, Zeebe 8, Jakarta EE 10
    // and every other shared library version. Do NOT hardcode managed versions.
    // This is a deployable application (leaf node), so use enforcedPlatform().
    implementation enforcedPlatform('org.mifos:paymenthub-ee-bom:2.0.0-SNAPSHOT')

    implementation 'org.apache.camel.springboot:camel-spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Bean Validation provider for the @Validated configuration records; without one the app does not start.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.apache.camel:camel-endpointdsl'
    implementation 'org.apache.camel:camel-jetty'
    implementation 'org.apache.camel:camel-undertow'
    implementation 'org.apache.camel:camel-http'
    implementation 'org.apache.camel.springboot:camel-jackson-starter'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.json:json'
    implementation 'io.camunda:zeebe-client-java'
    implementation 'com.auth0:java-jwt'
    implementation 'org.mifos:paymenthub-ee-core:2.0.0-SNAPSHOT'
    implementation 'com.google.api-client:google-api-client:1.32.2'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
}

group = 'org.mifos'
version = '2.0.0.mifos-SNAPSHOT'
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// spring-boot-starter-test ships JUnit 5; without this Gradle defaults to the
// JUnit 4 runner and silently skips every JUnit 5 test.
tasks.named('test') {
    useJUnitPlatform()
}

// Deterministic boot jar name so the Dockerfile can copy exactly one file
// (avoids the *.jar glob picking up the plain -plain.jar when `build` runs).
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
